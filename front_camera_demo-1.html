<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Front Camera Access Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;padding:20px;background:#f2f2f2;}
video{width:100%;max-width:400px;border:2px solid #000;border-radius:10px;}
button{padding:10px 15px;margin-top:10px;border:none;background:#007bff;color:#fff;border-radius:5px;}
</style>
</head>
<body>
<h2>Front Camera Access Demo</h2>
<p>Click the button below to access your front camera.</p>
<button onclick="startCam()">Start Camera</button>
<br><br>
<video id="vid" autoplay playsinline></video>

<script>
async function startCam(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });
    document.getElementById("vid").srcObject = stream;
  }catch(e){
    alert("Camera access blocked: " + e);
  }
}
</script>
</body>
</html>
